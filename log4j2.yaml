Configuration:
  status: warn
  appenders:
    fileError:
      type: File
      name: FileError
      fileName: logs/errors.log
      layout:
        type: PatternLayout
        pattern: "%d{yyyy-MM-dd HH:mm:ss} || [%t] || %logger{36} || %msg%n"
    fileUserRegistrations:
      type: File
      name: FileUserRegistrations
      fileName: logs/user-registrations.log
      layout:
        type: PatternLayout
        pattern: "%d{yyyy-MM-dd HH:mm:ss} || %msg%n"
    fileAppLogs:
      type: File
      name: FileAppLogs
      fileName: logs/app.log
      layout:
        type: PatternLayout
        pattern: "%d{yyyy-MM-dd HH:mm:ss} || %msg%n"
  loggers:
    logger:
      - name: UserRegistration
        level: info
        additivity: false
        AppenderRef:
          - ref: FileUserRegistrations
      - name: ApplicationLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: FileAppLogs
    root:
      level: error
      AppenderRef:
        - ref: FileError
